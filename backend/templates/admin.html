<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CelebrationAI - Дашборд</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --sidebar-bg: #1e293b;
            --card-bg: rgba(30, 41, 59, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --success: #10b981;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            background-image: radial-gradient(circle at top right, rgba(139, 92, 246, 0.08), transparent 50%),
                              radial-gradient(circle at bottom left, rgba(56, 189, 248, 0.05), transparent 50%);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--glass-border);
            padding: 24px 0;
            display: flex;
            flex-direction: column;
        }

        .brand {
            padding: 0 24px;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .nav-item {
            padding: 12px 24px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }

        .nav-item.active {
            color: var(--text-main);
            background: rgba(139, 92, 246, 0.1);
            border-left-color: var(--accent);
        }

        .nav-item:hover:not(.active) {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.02);
        }

        .logout {
            margin-top: auto;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .header-bar h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }

        .status-badge {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-badge::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .stat-title {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 700;
            margin: 0 0 8px 0;
        }

        .stat-desc {
            color: var(--text-muted);
            font-size: 13px;
        }

        /* Settings Card */
        .settings-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 32px;
        }

        .settings-card h2 {
            margin: 0 0 24px 0;
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            padding: 14px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 14px;
            box-sizing: border-box;
            transition: all 0.2s;
            resize: vertical;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
        }

        .btn-save {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-save:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="brand">
            <div class="brand-icon">CAI</div>
            CelebrationAI
        </div>
        <a href="#" class="nav-item active">Дашборд</a>
        <a href="/admin/logout" class="nav-item logout">Выйти</a>
    </div>

    <div class="main-content">
        <div class="header-bar">
            <h1>Панель управления</h1>
            <div class="status-badge">Сервер активен</div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">Всего пользователей</div>
                <div class="stat-value">{{ stats.total_users }}</div>
                <div class="stat-desc">Зарегистрировано в базе</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Premium подписки</div>
                <div class="stat-value">{{ stats.premium_users }}</div>
                <div class="stat-desc">Пользователи с активным PRO</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Дней рождений</div>
                <div class="stat-value">{{ stats.total_celebrations }}</div>
                <div class="stat-desc">Сохранено в базе данных</div>
            </div>
        </div>

        <div class="settings-card">
            <h2>Настройки Генерации ИИ</h2>
            <form method="post" action="/admin/save">
                <div class="form-group">
                    <label>Модель ИИ</label>
                    <select name="model" class="form-control">
                        <option value="gemini-1.5-flash" {% if model == 'gemini-1.5-flash' %}selected{% endif %}>Gemini 1.5 Flash</option>
                        <option value="gemini-1.5-pro" {% if model == 'gemini-1.5-pro' %}selected{% endif %}>Gemini 1.5 Pro</option>
                        <option value="gemini-2.0-flash" {% if model == 'gemini-2.0-flash' %}selected{% endif %}>Gemini 2.0 Flash</option>
                        <option value="gemini-2.5-flash-lite" {% if model == 'gemini-2.5-flash-lite' %}selected{% endif %}>Gemini 2.5 Flash Lite</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Системный Промпт (Критически важные правила)</label>
                    <textarea name="prompt" rows="8" class="form-control">{{ prompt }}</textarea>
                </div>
                <button type="submit" class="btn-save">Сохранить изменения</button>
            </form>
        </div>
    </div>

</body>
</html>
